    function Icon({ name, className = "w-5 h-5", ...props }) {

    // Dynamic Floating Embers Canvas
    function EmbersCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          canvas.width = canvas.parentElement.offsetWidth;
          canvas.height = canvas.parentElement.offsetHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const particleCount = 45;
        const particles = Array.from({ length: particleCount }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.2 + 0.8,
          speedY: Math.random() * 0.9 + 0.3,
          speedX: (Math.random() - 0.5) * 0.5,
          alpha: Math.random() * 0.7 + 0.2,
          fadeSpeed: Math.random() * 0.008 + 0.003
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.y -= p.speedY;
            p.x += p.speedX;
            p.alpha -= p.fadeSpeed;

            if (p.y < 0 || p.alpha <= 0) {
              p.y = canvas.height + Math.random() * 20;
              p.x = Math.random() * canvas.width;
              p.alpha = Math.random() * 0.8 + 0.2;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 85, 0, ${p.alpha})`;
            ctx.shadowColor = '#ff5500';
            ctx.shadowBlur = p.radius * 5;
            ctx.fill();
            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="absolute inset-0 pointer-events-none z-10 w-full h-full"
        />
      );
    }

        { id: 'turbo-whistle', name: 'Turbo Whistling Noise / Intercooler Oil Dripping', base: 3500 }
      ];

      const toggleIssue = (id) => {
        if (selectedIssues.includes(id)) {
          setSelectedIssues(selectedIssues.filter(item => item !== id));
        } else {
          setSelectedIssues([...selectedIssues, id]);
        }
      };

      const { originalTotal, discountedTotal, savings } = useMemo(() => {
        const currentVehicle = VEHICLES.find(v => v.id === vehicleType) || VEHICLES[0];

        const discount = raw * 0.25; // 25% OFF promotional discount!
        return {

                    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Your Full Name</label>
                    <input
                      name="name"
                      type="text"
                      required
                      placeholder="e.g. Ramesh Kumar"
                      className="w-full bg-garage-surface border border-white/10 rounded-sm px-4 py-3 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Phone Number (WhatsApp)</label>
                    <input
                      name="phone"
                      type="tel"
                      required
                      placeholder="e.g. 099312 27178"
                      className="w-full bg-garage-surface border border-white/10 rounded-sm px-4 py-3 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Vehicle / Engine</label>
                      <input
                        name="vehicle"
                        type="text"
                        required
                        placeholder="e.g. Tata Signa / Bolero"
                        className="w-full bg-garage-surface border border-white/10 rounded-sm px-4 py-3 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Service Needed</label>
                      <select
                        name="service"
                        className="w-full bg-garage-surface border border-white/10 rounded-sm px-4 py-3 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                      >
                        <option value="CRDI Injector Testing">CRDI Injector Testing</option>
                        <option value="Diesel Pump Overhaul">Diesel Pump Overhaul</option>
                        <option value="Black Smoke & Pickup Fix">Black Smoke & Pickup Fix</option>
                        <option value="Turbocharger Balancing">Turbocharger Balancing</option>
                        <option value="Tractor Pump Tuning">Tractor Pump Tuning</option>
                      </select>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full chamfer-btn bg-garage-orange hover:bg-garage-orange-glow text-black font-display font-extrabold text-base tracking-wider uppercase py-3.5 shadow-glow-orange flex items-center justify-center gap-2 mt-4 cursor-pointer"
                  >
                    <Icon name="send" className="w-4 h-4" />
                    <span>SUBMIT INQUIRY (25% LAB DISCOUNT)</span>
                  </button>
                </form>
              </div>

            </div>
          </div>
        </section>
      );
    }

    // Footer
    function Footer() {
      return (
        <footer className="bg-garage-black border-t border-white/10 py-12 text-gray-400 font-sans">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row items-center justify-between gap-6 pb-8 border-b border-white/10">
              <div className="text-center md:text-left">
                <span className="font-display font-black text-3xl tracking-tight text-garage-orange uppercase block">
                  {BRAND_NAME}
                </span>
                <span className="font-mono text-xs tracking-[0.2em] text-gray-400 font-semibold uppercase">
                  {BRAND_NAME_HI} • {LOCATION_SUBTITLE}
                </span>
              </div>

              <div className="flex items-center gap-8 font-display text-sm uppercase tracking-wider">
                <a href="#home" className="hover:text-white transition-colors">Home</a>
                <a href="#about" className="hover:text-white transition-colors">About</a>
                <a href="#services" className="hover:text-white transition-colors">Services</a>
                <a href="#estimator" className="hover:text-white transition-colors">Cost Estimator</a>
                <a href="#contact" className="hover:text-white transition-colors">Contact</a>
              </div>
            </div>

            <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-gray-500 gap-4">
              <span>© {new Date().getFullYear()} {BRAND_NAME}. ALL RIGHTS RESERVED.</span>
              <span className="text-gray-400">PATNA PREMIER CRDI & DIESEL FUEL INJECTION LAB (EST. 2002)</span>
            </div>
          </div>
        </footer>
      );
    }

    // Interactive Booking Modal
    function BookingModal({ isOpen, onClose, defaultService = "CRDI Injector Testing" }) {
      const [service, setService] = useState(defaultService);
      const [vehicle, setVehicle] = useState("Commercial Heavy Truck");
      const [pickupNeeded, setPickupNeeded] = useState(false);

      useEffect(() => {
        setService(defaultService);
      }, [defaultService]);

      if (!isOpen) return null;

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        const form = e.target;
        const name = form.name.value;
        const phone = form.phone.value;
        const date = form.date.value;
        const address = pickupNeeded ? form.address.value : "Direct visit to workshop at Mahadev Asthan, Paijawa";

        const text = `*NEW LAB APPOINTMENT - MAA DURGA DIESEL*\n\n` +
          `• *Customer:* ${name}\n` +
          `• *Phone:* ${phone}\n` +
          `• *Service:* ${service}\n` +
          `• *Vehicle / Engine:* ${vehicle}\n` +
          `• *Preferred Date:* ${date}\n` +
          `• *Location/Address:* ${address}\n` +
          `• *Promo:* 25% Online Discount Applied!\n\n` +
          `Please confirm my lab calibration slot.`;

        window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-in fade-in duration-200">
          <div className="relative w-full max-w-lg bg-garage-surface border border-garage-orange/40 rounded-sm shadow-2xl p-6 sm:p-8">
            
            {/* Close Button */}
            <button
              onClick={onClose}
              className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white cursor-pointer"
            >
              <Icon name="x" className="w-6 h-6" />
            </button>

            <div className="mb-6">
              <span className="font-mono text-xs font-bold text-garage-orange tracking-widest uppercase block">
                // MAA DURGA DIESEL LAB BOOKING
              </span>
              <h3 className="font-display font-black text-3xl uppercase tracking-tight text-white mt-1">
                BOOK LAB APPOINTMENT
              </h3>
              <p className="text-gray-400 text-xs font-mono uppercase mt-1">
                25% Online Discount Applied • Computerized 2,200 Bar Testing
              </p>
            </div>

            <form onSubmit={handleBookingSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Your Full Name</label>
                <input
                  name="name"
                  type="text"
                  required
                  placeholder="Your Name"
                  className="w-full bg-garage-black border border-white/10 rounded-sm px-4 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Phone (WhatsApp)</label>
                  <input
                    name="phone"
                    type="tel"
                    required
                    placeholder="e.g. 099312 27178"
                    className="w-full bg-garage-black border border-white/10 rounded-sm px-4 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                  />
                </div>
                <div>
                  <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Preferred Date</label>
                  <input
                    name="date"
                    type="date"
                    required
                    defaultValue={new Date().toISOString().split('T')[0]}
                    className="w-full bg-garage-black border border-white/10 rounded-sm px-4 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Primary Service</label>
                  <select
                    value={service}
                    onChange={(e) => setService(e.target.value)}
                    className="w-full bg-garage-black border border-white/10 rounded-sm px-3 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                  >
                    <option value="CRDI INJECTOR CALIBRATION">CRDI Injector Testing</option>
                    <option value="DIESEL PUMP (FIP) OVERHAUL">Diesel Pump Overhaul</option>
                    <option value="TURBO REPAIR & BALANCING">Turbo Balancing</option>
                    <option value="COMMERCIAL TRUCK FLEET">Commercial Fleet Express</option>
                    <option value="TRACTOR & HARVESTER SERVICE">Tractor Pump Tuning</option>
                    <option value="SMOKE FIX & MILEAGE TUNING">Smoke Fix & Mileage</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Vehicle / Engine</label>
                  <select
                    value={vehicle}
                    onChange={(e) => setVehicle(e.target.value)}
                    className="w-full bg-garage-black border border-white/10 rounded-sm px-3 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                  >
                    <option value="Commercial Heavy Truck">Heavy Truck (Tata / Leyland)</option>
                    <option value="Pickup / LCV">Pickup (Bolero / Tata Ace)</option>
                    <option value="Agricultural Tractor">Tractor (Swaraj / Mahindra)</option>
                    <option value="Passenger Diesel SUV">Diesel Car / SUV (Scorpio / Innova)</option>
                    <option value="DG Set Generator">DG Set Generator</option>
                  </select>
                </div>
              </div>

              <div className="pt-1">
                <label className="flex items-center gap-2.5 cursor-pointer">
                  <input
                    type="checkbox"
                    checked={pickupNeeded}
                    onChange={(e) => setPickupNeeded(e.target.checked)}
                    className="w-4 h-4 accent-garage-orange"
                  />
                  <span className="font-mono text-xs text-garage-orange font-bold uppercase">
                    Need Part Pickup / On-Site Highway Assistance
                  </span>
                </label>
              </div>

              {pickupNeeded && (
                <div>
                  <label className="block text-xs font-mono uppercase text-gray-400 mb-1">Pickup Location / Highway Area</label>
                  <input
                    name="address"
                    type="text"
                    required={pickupNeeded}
                    placeholder="Enter location on Patna Bypass / City area"
                    className="w-full bg-garage-black border border-white/10 rounded-sm px-4 py-2.5 text-white text-sm focus:outline-none focus:border-garage-orange font-sans"
                  />
                </div>
              )}

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full chamfer-btn bg-garage-orange hover:bg-garage-orange-glow text-black font-display font-extrabold text-base tracking-wider uppercase py-3.5 shadow-glow-orange flex items-center justify-center gap-2 cursor-pointer"
                >
                  <Icon name="calendar-check" className="w-5 h-5" />
                  <span>CONFIRM ON WHATSAPP (25% OFF)</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Persistent Floating CTA Button
    function FloatingCta({ onBookClick }) {
      return (
        <div className="fixed bottom-6 right-6 z-40">
          <button
            onClick={onBookClick}
            className="chamfer-btn bg-garage-orange hover:bg-garage-orange-glow text-black font-display font-black text-sm sm:text-base tracking-wider uppercase px-6 py-3.5 shadow-glow-orange hover:scale-105 transition-all flex items-center gap-2 cursor-pointer"
          >
            <span>BOOK NOW</span>
          </button>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [bookingModalOpen, setBookingModalOpen] = useState(false);
      const [selectedServiceForModal, setSelectedServiceForModal] = useState("CRDI Injector Testing");

      const handleOpenBooking = (serviceName = "CRDI Injector Testing") => {
        setSelectedServiceForModal(serviceName);
        setBookingModalOpen(true);
      };

      return (
        <div className="relative min-h-screen bg-garage-black text-gray-100 flex flex-col font-sans">
          {/* Top Header */}
          <Header onBookClick={() => handleOpenBooking("General Lab Inquiry")} />

          {/* Main Content Flow */}
          <main className="flex-grow">
            {/* 1. Hero Section (Screenshot 1 Layout with Maa Durga Diesel content) */}
            <Hero onBookClick={() => handleOpenBooking("Hero Quick Booking")} />

            {/* 2. About Us Section (Screenshot 2 Layout) */}
            <AboutSection onExploreClick={() => {}} />

            {/* 3. 25% Off Promotional Banner (Screenshot 3 Layout) */}
            <OfferBanner onBookClick={() => handleOpenBooking("25% Off Lab Offer")} />

            {/* 4. Services Grid (Screenshot 3 Layout) */}
            <ServicesSection onBookService={(srv) => handleOpenBooking(srv)} />

            {/* 5. Before & After Calibration Slider */}
            <DiagnosticSlider />

            {/* 6. Diagnostic & Cost Estimator */}
            <DiagnosticEstimator onBookCustomPackage={(pkg) => handleOpenBooking(`Custom Diagnosis: ${pkg.vehicle} (₹${pkg.total})`)} />

            {/* 7. Reviews */}
            <ReviewsSection />

            {/* 8. FAQ Accordion */}
            <FaqSection />

            {/* 9. Contact & Location Hub */}
            <ContactSection onBookClick={() => handleOpenBooking("Contact Hub Booking")} />
          </main>

          {/* Footer */}
          <Footer />

          {/* Persistent Floating Bottom-Right "BOOK NOW" Button */}
          <FloatingCta onBookClick={() => handleOpenBooking("Floating CTA")} />

          {/* Interactive Booking Modal */}
          <BookingModal
            isOpen={bookingModalOpen}
            onClose={() => setBookingModalOpen(false)}
            defaultService={selectedServiceForModal}
          />
        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
